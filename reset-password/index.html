<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Reset password — AdigunSPs</title>
  <link rel="icon" href="../assets/brand/adigunsps-icon-dark-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./reset-password.css">
  <script src="../runtime-config.js"></script>
  <script src="../vendor/supabase.js"></script>
  <script type="module" src="./reset-password.js"></script>
</head>
<body>
  <main class="reset-card" aria-labelledby="page-title">
    <a class="brand" href="../" aria-label="AdigunSPs home"><img src="../assets/brand/company-official.jpg" alt="HEPHZIBAH BEHULAH"><span>AdigunSPs</span></a>
    <h1 id="page-title">Reset your password</h1>
    <p id="reset-status" class="status" role="status" aria-live="polite">Checking your recovery link…</p>
    <form id="reset-form" hidden>
      <label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label>
      <button type="submit">Save new password</button>
    </form>
    <a class="back-link" href="../?account=sign-in">Return to sign in</a>
    <p class="attribution">AdigunSPs — a product of HEPHZIBAH BEHULAH</p>
  </main>
</body>
</html>
