project_id = "adigunsps"

[api]
schemas = ["public", "graphql_public", "adigunsps"]

[auth]
site_url = "http://127.0.0.1:8915"
enable_anonymous_sign_ins = true

[auth.email]
enable_confirmations = true
max_frequency = "1s"
otp_expiry = 600

[auth.email.template.confirmation]
subject = "AdigunSPs preview activation code"
content_path = "./supabase/templates/local-account-code.html"

[auth.email.template.magic_link]
subject = "AdigunSPs preview sign-in code"
content_path = "./supabase/templates/local-account-code.html"
