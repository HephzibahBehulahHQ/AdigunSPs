name: ESP32 USB firmware
on:
  pull_request:
    paths:
      - 'firmware/esp32-usb/**'
      - '.github/workflows/esp32-usb.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/esp32-usb/**'
      - '.github/workflows/esp32-usb.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.2.2'
      - name: Install pinned firmware dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.0 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ArduinoJson@7.4.2
      - name: Compile ESP32 USB firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/esp32-usb
