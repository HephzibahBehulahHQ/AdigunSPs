name: Deploy AdigunSPs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Supabase browser bundle if omitted from install
        shell: bash
        run: |
          bundle="node_modules/@supabase/supabase-js/dist/umd/supabase.js"
          if [ ! -s "$bundle" ]; then
            SUPABASE_ARCHIVE="$(npm pack --silent --pack-destination "$RUNNER_TEMP" @supabase/supabase-js@2.118.0)"
            mkdir -p "$(dirname "$bundle")"
            tar -xOf "$RUNNER_TEMP/$SUPABASE_ARCHIVE" package/dist/umd/supabase.js > "$bundle"
          fi
          test -s "$bundle"
      - name: Run validation suite
        run: npm test
      - name: Build static application
        env:
          ADIGUN_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kUwuugYcMSOUVfSicQE1TQ_2j_B6P8o
          ADIGUN_AI_ENABLED: ${{ vars.ADIGUN_AI_ENABLED || 'true' }}
          ADIGUN_AI_WORKER_URL: ${{ vars.ADIGUN_AI_WORKER_URL || 'https://adigunsps-ai.hephzibah-behulah.workers.dev' }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Add Pages deployment metadata
        run: |
          touch dist/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > dist/release-sha.txt
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        timeout-minutes: 5
        with:
          path: dist
      - name: Save validated assets for Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: adigunsps-worker-assets
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-production:
    timeout-minutes: 10
    environment:
      name: cloudflare-production
      url: https://adigunsps.hephzibahbehulah.com
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out the release source
        uses: actions/checkout@v6
      - name: Download the validated build
        uses: actions/download-artifact@v4
        with:
          name: adigunsps-worker-assets
          path: dist
      - name: Verify the worker asset release
        run: test "$(cat dist/release-sha.txt)" = "$GITHUB_SHA"
      - name: Deploy to the AdigunSPs production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.account-preview.toml --env production --keep-vars
