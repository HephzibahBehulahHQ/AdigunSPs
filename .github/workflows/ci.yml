name: AdigunSPs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and static build
    runs-on: ubuntu-latest
    container:
      # Match @playwright/test in package-lock.json when upgrading this image.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user pwuser
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore Supabase browser bundle if omitted from install
        shell: bash
        run: |
          bundle="node_modules/@supabase/supabase-js/dist/umd/supabase.js"
          if [ ! -s "$bundle" ]; then
            SUPABASE_ARCHIVE="$(npm pack --silent --pack-destination "$RUNNER_TEMP" @supabase/supabase-js@2.118.0)"
            mkdir -p "$(dirname "$bundle")"
            tar -xOf "$RUNNER_TEMP/$SUPABASE_ARCHIVE" package/dist/umd/supabase.js > "$bundle"
          fi
          test -s "$bundle"
      - name: Run automated suite
        run: npm test
      - name: Run browser acceptance checks
        run: npm run test:e2e
      - name: Verify workspace behavior in Firefox and WebKit
        shell: bash
        run: |
          for browser in firefox webkit; do
            ADIGUNSP_TEST_BROWSER="$browser" npm run test:e2e -- --grep 'Studio navigation|offline PWA navigation|recovery snapshots commit together|cached member|offline program round-trip|opening a palette result|metadata edits preserve|touch workspace|mobile drawer keyboard|Issues tab shows|large imported ladder|continuous scans preserve|trace history exports|HMI alarm hysteresis|analog input fault offsets|wired analog current feeds|reviewed HMI recipe|PLCopen TON XML|PLCopen LD TOF|PLCopen Structured Text body|PLCopen Boolean FBD|all application menus|without overlap|core LD|retains its viewport|Ladder and Function Block outlines|SFC starts and resets|project explorer switches|project header shows the reference breadcrumb|electrical duplicate placement|electrical component search filters|editor visual matrix|workspace layout remains bounded|canvas toolbars stay compact|side-panel layout changes|wire endpoints track'
          done
      - name: Build static application
        run: npm run build
