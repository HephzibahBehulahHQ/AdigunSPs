name: AdigunSPs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-project-policies:
    name: Cloud project access policies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify cloud membership with PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat tests/sql/supabase-cloud-fixture.sql \
            supabase/migrations/20261030131133_adigunsps_auth_cloud.sql \
            supabase/migrations/20261101075618_adigunsps_schema_and_guest_upgrade.sql \
            supabase/migrations/20261101114255_adigunsps_rls_query_performance.sql \
            supabase/migrations/20261121230000_adigunsps_cloud_project_memberships.sql \
            tests/sql/cloud-project-memberships.sql |
            docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres

  verify:
    name: Tests and static build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore Supabase browser bundle if omitted from install
        shell: bash
        run: |
          bundle="node_modules/@supabase/supabase-js/dist/umd/supabase.js"
          if [ ! -s "$bundle" ]; then
            SUPABASE_ARCHIVE="$(npm pack --silent --pack-destination "$RUNNER_TEMP" @supabase/supabase-js@2.118.0)"
            mkdir -p "$(dirname "$bundle")"
            tar -xOf "$RUNNER_TEMP/$SUPABASE_ARCHIVE" package/dist/umd/supabase.js > "$bundle"
          fi
          test -s "$bundle"
      - name: Run automated suite
        run: npm test
      - name: Install Chromium for browser acceptance checks
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance checks
        run: npm run test:e2e
      - name: Install Firefox and WebKit for workspace checks
        run: npx playwright install --with-deps firefox webkit
      - name: Verify workspace behavior in Firefox and WebKit
        shell: bash
        run: |
          for browser in firefox webkit; do
            ADIGUNSP_TEST_BROWSER="$browser" npm run test:e2e -- --grep 'offline PWA navigation|recovery snapshots commit together|cached member|opening a palette result|metadata edits preserve|touch workspace|mobile drawer keyboard|large imported ladder|continuous scans preserve|trace history exports|HMI alarm hysteresis|analog input fault offsets|reviewed HMI recipe|PLCopen TON XML|PLCopen LD TOF|PLCopen Structured Text body|PLCopen Boolean FBD|all application menus|without overlap|core LD|side-panel layout changes|wire endpoints track'
          done
      - name: Build static application
        run: npm run build
