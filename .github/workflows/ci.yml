name: AdigunSPs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and static build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Restore Supabase browser bundle if omitted from install
        shell: bash
        run: |
          bundle="node_modules/@supabase/supabase-js/dist/umd/supabase.js"
          if [ ! -s "$bundle" ]; then
            SUPABASE_ARCHIVE="$(npm pack --silent --pack-destination "$RUNNER_TEMP" @supabase/supabase-js@2.118.0)"
            mkdir -p "$(dirname "$bundle")"
            tar -xOf "$RUNNER_TEMP/$SUPABASE_ARCHIVE" package/dist/umd/supabase.js > "$bundle"
          fi
          test -s "$bundle"
      - name: Run automated suite
        run: npm test
      - name: Install Chromium for browser acceptance checks
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance checks
        run: npm run test:e2e
      - name: Install Firefox and WebKit for workspace checks
        run: npx playwright install --with-deps firefox webkit
      - name: Verify workspace behavior in Firefox and WebKit
        shell: bash
        run: |
          for browser in firefox webkit; do
            ADIGUNSP_TEST_BROWSER="$browser" npm run test:e2e -- --grep 'offline PWA navigation|recovery snapshots commit together|touch workspace|mobile drawer keyboard|without overlap|core LD|side-panel layout changes|wire endpoints track'
          done
      - name: Build static application
        run: npm run build
