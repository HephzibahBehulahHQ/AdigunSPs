name: Verify deployed AdigunSPs UI

on:
  workflow_run:
    workflows: ["Deploy AdigunSPs to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  production-ui:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare screenshot output
        run: mkdir -p artifacts

      - name: Verify production workspace and capture canvas screenshots
        env:
          ADIGUNSP_BASE_URL: https://adigunsps.hephzibahbehulah.com
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          ADIGUNSP_SCREENSHOT_PATH: artifacts/adigunsps-electrical-1894x850.png
          ADIGUNSP_HMI_SCREENSHOT_PATH: artifacts/adigunsps-hmi-1894x850.png
        shell: bash
        run: |
          read_release() {
            curl --fail --silent --show-error --max-time 10 \
              "$ADIGUNSP_BASE_URL/release-sha.txt?check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RANDOM"
          }
          for attempt in {1..6}; do
            served_sha=$(read_release) || served_sha=""
            if [[ "$served_sha" == "$EXPECTED_RELEASE_SHA" ]]; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "::error::Expected deployment $EXPECTED_RELEASE_SHA, served ${served_sha:-no release marker}."
              exit 1
            fi
            sleep 5
          done

          npx playwright test --grep "offline PWA navigation|cached member|offline program round-trip|local project metadata edits preserve|opening a palette result uses the latest saved project|mobile drawer keyboard|Issues tab shows|Ladder and Function Block outlines|SFC starts and resets|project explorer switches|project header shows the reference breadcrumb|side-panel layout changes|workspace layout remains bounded|canvas toolbars stay compact|retains its viewport|1894px electrical workspace geometry|real multi-pin schematic models recover from example-style overlap without changing wires|component bodies remain draggable while wire mode is armed"

          served_sha=$(read_release) || served_sha=""
          if [[ "$served_sha" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo "::error::Expected deployment $EXPECTED_RELEASE_SHA after smoke tests, served ${served_sha:-no release marker}."
            exit 1
          fi

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adigunsps-production-ui-${{ github.event.workflow_run.head_sha }}
          path: artifacts/*.png
          if-no-files-found: warn
