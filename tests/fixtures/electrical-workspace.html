<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Electrical workspace browser check</title>
<link rel="stylesheet" href="../../styles.css">
<main id="workspace"></main>
<script type="module">
import { createElectricalComponent, connectElectricalTerminals } from '../../src/electrical.js';
import { renderElectricalWorkspace } from '../../src/electrical-ui.js';
const fuse=createElectricalComponent('fuse',1,300,120);
const supply=createElectricalComponent('supply24vdc',1,80,120);
const lamp=createElectricalComponent('pilotLamp',1,520,120);
const electrical={components:[fuse,supply,lamp],wires:[]};
for(const [a,ap,b,bp] of [[supply,'+',fuse,'1'],[fuse,'2',lamp,'X1'],[lamp,'X2',supply,'−']]) {
 const result=connectElectricalTerminals(electrical,{componentId:a.id,terminal:ap},{componentId:b.id,terminal:bp});
 if(!result.ok) throw Error(result.error);
 electrical.wires.push(result.wire);
}
renderElectricalWorkspace(document.querySelector('#workspace'),{tags:[],electrical});
</script>
</html>
