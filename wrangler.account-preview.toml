name = "adigunsps-account-preview"
main = "cloudflare/adigun-product-worker.js"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "53"
simple = { limit = 10, period = 60 }


[env.production]
name = "adigunsps-product"
workers_dev = false
preview_urls = false
routes = [{ pattern = "adigunsps.hephzibahbehulah.com/*", zone_name = "hephzibahbehulah.com" }]

[env.production.vars]
SUPABASE_URL = "https://fqcbfnktdvqojyezxeis.supabase.co"
ACCOUNT_ADMIN_ORIGIN = "https://admin.hephzibahbehulah.com"

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[[env.production.ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "54"
simple = { limit = 10, period = 60 }
